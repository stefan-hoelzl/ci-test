on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [6, 7, 8]
    steps:
      - shell: python
        run: |
          import time
          if ${{ matrix.version }} == 6:
            raise RuntimeError("is 6")
          time.sleep(10)
          raise RuntimeError("slept")
